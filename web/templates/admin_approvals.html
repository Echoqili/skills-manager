<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理员审批台</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --border:#e3e8ef; --text:#1f2937;
    --muted:#6b7280; --primary:#2563eb; --primary-d:#1d4ed8;
    --green:#16a34a; --red:#dc2626; --green-bg:#dcfce7; --red-bg:#fee2e2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);padding:32px 16px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--border);
    border-radius:8px;font-size:14px;margin-bottom:12px}
  input:focus{outline:none;border-color:var(--primary)}
  button{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-ok{background:var(--green);color:#fff}
  .btn-no{background:var(--red);color:#fff}
  .btn-ghost{background:#eef2f7;color:var(--text)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hidden{display:none}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
  .b-pending{background:#fef9c3;color:#854d0e}
  .msg{font-size:13px;margin-top:10px}
  .err{color:var(--red)} .ok{color:var(--green)}
  .tip{font-size:12px;color:var(--muted);margin-top:8px}
  .create-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:540px){.create-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 管理员审批台</h1>
  <div class="sub">此页面不对外开放，需输入管理员密钥（环境变量 <code>ADMIN_APPROVAL_KEY</code>）进入。</div>

  <!-- 密钥门禁 -->
  <div class="card" id="gate">
    <label for="key">管理员密钥</label>
    <input type="password" id="key" placeholder="请输入 ADMIN_APPROVAL_KEY" autocomplete="off">
    <div class="row">
      <button class="btn-primary" id="enterBtn">进入</button>
    </div>
    <div class="msg err hidden" id="gateErr"></div>
    <div class="tip">密钥仅在本地内存中保存，用于后续接口调用；刷新页面需重新输入。</div>
  </div>

  <!-- 审批区 -->
  <div class="card hidden" id="panel">
    <h1 style="font-size:16px">待审批注册</h1>
    <div class="tip" style="margin-bottom:12px">批准的账号即可登录；拒绝的账号将永久无法登录（可重新注册再次申请）。</div>
    <div id="listWrap"><div class="msg">加载中…</div></div>
    <div class="msg err hidden" id="panelErr"></div>
  </div>

  <!-- 创建账号 -->
  <div class="card hidden" id="createCard">
    <h1 style="font-size:16px">创建账号</h1>
    <div class="tip" style="margin-bottom:12px">用于引导首位管理员，或直接为团队成员开通已批准账号。</div>
    <div class="create-grid">
      <div>
        <label for="cUser">用户名</label>
        <input type="text" id="cUser" placeholder="用户名" autocomplete="off">
      </div>
      <div>
        <label for="cPass">密码</label>
        <input type="password" id="cPass" placeholder="至少 6 位" autocomplete="off">
      </div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <label style="margin:0"><input type="checkbox" id="cAdmin"> 设为管理员</label>
    </div>
    <button class="btn-primary" id="createBtn">创建</button>
    <div class="msg ok hidden" id="createOk"></div>
    <div class="msg err hidden" id="createErr"></div>
  </div>
</div>

<script>
let ADMIN_KEY = sessionStorage.getItem('admin_key') || '';

function authHeaders(){
  return {'Content-Type':'application/json', 'X-Admin-Key': ADMIN_KEY};
}
function show(id, on){ document.getElementById(id).classList.toggle('hidden', !on); }

async function enter(){
  const key = document.getElementById('key').value.trim();
  if(!key){ document.getElementById('gateErr').textContent='请输入密钥'; show('gateErr', true); return; }
  ADMIN_KEY = key; sessionStorage.setItem('admin_key', key);
  // 验证密钥
  const r = await fetch('/api/admin/pending', {headers: authHeaders()});
  if(r.status === 401){
    document.getElementById('gateErr').textContent='密钥错误，拒绝访问'; show('gateErr', true);
    ADMIN_KEY=''; sessionStorage.removeItem('admin_key'); return;
  }
  show('gate', false); show('panel', true); show('createCard', true);
  loadPending();
}

async function loadPending(){
  const wrap = document.getElementById('listWrap');
  wrap.innerHTML = '<div class="msg">加载中…</div>';
  try{
    const r = await fetch('/api/admin/pending', {headers: authHeaders()});
    const d = await r.json();
    if(!r.ok){ wrap.innerHTML = '<div class="msg err">'+(d.error||'加载失败')+'</div>'; return; }
    if(!d.users.length){ wrap.innerHTML = '<div class="msg">暂无待审批用户 🎉</div>'; return; }
    let html = '<table><thead><tr><th>用户名</th><th>注册时间</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    for(const u of d.users){
      html += `<tr>
        <td>${esc(u.username)}</td>
        <td>${esc((u.created_at||'').replace('T',' ').slice(0,19))}</td>
        <td><span class="badge b-pending">待审批</span></td>
        <td class="row">
          <button class="btn-ok" data-act="approve" data-u="${esc(u.username)}">批准</button>
          <button class="btn-no" data-act="reject" data-u="${esc(u.username)}">拒绝</button>
        </td></tr>`;
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;
    wrap.querySelectorAll('button[data-act]').forEach(b=>{
      b.addEventListener('click', ()=>decide(b.dataset.act, b.dataset.u));
    });
  }catch(e){ wrap.innerHTML = '<div class="msg err">网络错误：'+e.message+'</div>'; }
}

async function decide(act, username){
  const r = await fetch('/api/admin/'+act, {method:'POST', headers: authHeaders(),
    body: JSON.stringify({username})});
  const d = await r.json().catch(()=>({}));
  if(r.ok){ loadPending(); }
  else { document.getElementById('panelErr').textContent = d.error||'操作失败'; show('panelErr', true); }
}

async function createUser(){
  show('createOk', false); show('createErr', false);
  const username = document.getElementById('cUser').value.trim();
  const password = document.getElementById('cPass').value;
  const is_admin = document.getElementById('cAdmin').checked;
  if(!username || !password){ document.getElementById('createErr').textContent='用户名和密码必填'; show('createErr', true); return; }
  const r = await fetch('/api/admin/create', {method:'POST', headers: authHeaders(),
    body: JSON.stringify({username, password, is_admin})});
  const d = await r.json().catch(()=>({}));
  if(r.ok){ document.getElementById('createOk').textContent = d.message||'创建成功'; show('createOk', true);
    document.getElementById('cUser').value=''; document.getElementById('cPass').value=''; }
  else { document.getElementById('createErr').textContent = d.error||'创建失败'; show('createErr', true); }
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('enterBtn').addEventListener('click', enter);
document.getElementById('key').addEventListener('keydown', e=>{ if(e.key==='Enter') enter(); });
document.getElementById('createBtn').addEventListener('click', createUser);
if(ADMIN_KEY){ /* 已有缓存密钥，自动尝试进入 */ enter(); }
</script>
</body>
</html>
