services:
  - type: web
    name: skills-manager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT web.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      # 仅用于首次启动播种管理密钥哈希；之后以数据库存储为准（可在 /admin/approvals 修改）
      - key: ADMIN_APPROVAL_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ZHIPU_API_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: ZHIPU_API_KEY
        sync: false
      - key: ZHIPU_MODEL
        value: glm-4-flash
