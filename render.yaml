services:
  - type: web
    name: skills-manager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT web.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      # 仅用于首次启动播种管理密钥哈希；之后以数据库存储为准（可在 /admin/approvals 修改）
      - key: ADMIN_APPROVAL_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # 邮箱验证码发送（SMTP，如 QQ/163 邮箱授权码；本地调试可设 MAIL_DEBUG_PRINT=1 打印验证码）
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_DEBUG_PRINT
        value: "false"
      # 注册邮箱验证码开关：EMAIL_VERIFY=0 关闭（当前邮件服务不可用，先关掉；
      # SMTP 修好后改回 "1" 即可恢复邮箱验证码）
      - key: EMAIL_VERIFY
        value: "0"
      - key: AI_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: glm-4-flash
